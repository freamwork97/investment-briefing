site_name: 투자 브리핑
docs_dir: docs
site_dir: ../investment-briefing-site
site_description: 글로벌 시황 & 국장 트레이딩 데일리 브리핑
site_url: https://freamwork97.github.io/investment-briefing/
repo_url: https://github.com/freamwork97/investment-briefing
repo_name: freamwork97/investment-briefing
edit_uri: edit/main/

theme:
  name: material
  language: ko
  palette:
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/custom.css

plugins:
  - awesome-pages
  - search:
      lang: ko
  - roamlinks  # Obsidian [[wikilinks]] 지원

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - admonition

nav:
  - 🏠 홈: index.md
  - ...
